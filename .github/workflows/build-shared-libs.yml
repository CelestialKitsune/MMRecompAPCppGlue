name: Build Shared Libraries

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Configure CMake
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: List .so files
        run: find build -name "*.so"
      - name: Upload .so artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-shared-libs
          path: |
            build/**/*.so

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure CMake (first time)
        run: cmake -S . -B build
      - name: Configure CMake (second time)
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: List .dll files
        run: Get-ChildItem -Recurse -Filter *.dll build
        - name: Upload .dll artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-shared-libs
          path: |
            build/**/*.dll